# Render Blueprint for BotTrunk. Docs: https://render.com/docs/blueprint-spec
# One web service (the Rails gateway, Docker) + one Postgres. Runbook: docs/deploy.md
services:
  - type: web
    name: bottrunk-gateway
    runtime: docker
    rootDir: gateway
    dockerfilePath: ./Dockerfile
    dockerCommand: ./bin/render-start
    preDeployCommand: ./bin/rails db:prepare
    plan: starter
    region: ohio
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: RAILS_ENV
        value: production
      - key: BINDING
        value: 0.0.0.0
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: RAILS_LOG_LEVEL
        value: info
      - key: RAILS_MASTER_KEY
        sync: false            # paste from gateway/config/master.key in the Render dashboard
      - key: ADMIN_PASSWORD
        sync: false            # HTTP basic auth for /admin/* (user: anything, e.g. admin)
      - key: HNL_RATE_SPREAD
        value: "1.50"          # lempiras per dollar below the reference rate (deposit-bac-*)
      - key: DEPOSIT_FEE_BPS
        value: "500"           # 5 % fee on top of the spread
      - key: MAXMIND_LICENSE_KEY
        sync: false            # free GeoLite2 key: country/city of visitors in /admin/stats
      - key: BCH_API_KEY
        sync: false            # Banco Central de Honduras Web API key (free): hourly reference rate
      - key: CLOUDFLARE_API_TOKEN
        sync: false            # Browser Rendering ("Browser Run" permission): scrape-markdown-js, screenshot-url, pdf-url
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false            # the account the renders are billed to; it goes in the API path, not a header
      # BCH_TCR_INDICATOR_ID (optional, default 97) · HNL_PER_USD (optional): pin the rate by hand
      - key: DATABASE_URL
        fromDatabase:
          name: bottrunk-db
          property: connectionString
      - key: BOTTRUNK_PUBLIC_HOST
        value: https://api.bottrunk.com
      - key: ALGORAND_NETWORK
        value: mainnet         # gateway wallet opted in to USDC 31566704 on Sept 11, 2026
      - key: APP_HOST
        value: bottrunk.com
      # ---- Transactional email (Resend SMTP). Without SMTP_ADDRESS the app
      # ---- logs a warning and sends nothing, which is the safe default.
      - key: SMTP_ADDRESS
        value: smtp.resend.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_DOMAIN
        value: bottrunk.com
      - key: SMTP_USER_NAME
        value: resend
      - key: SMTP_PASSWORD
        sync: false            # Resend API key (re_...) — paste in the dashboard, never in git
      - key: MAIL_FROM
        value: BotTrunk <no-reply@bottrunk.com>
      - key: MAIL_REPLY_TO
        value: hello@bottrunk.com
      - key: ADMIN_EMAIL
        sync: false            # where deposit alerts and the daily digest go

  # One run a day at 07:00 in Honduras (UTC-6): the operations digest.
  # Billed per second of runtime, so a ten-second job costs pennies a year.
  - type: cron
    name: bottrunk-digest
    runtime: docker
    rootDir: gateway
    dockerfilePath: ./Dockerfile
    dockerCommand: ./bin/rails mail:digest
    schedule: "0 13 * * *"
    plan: starter
    region: ohio
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_LEVEL
        value: info
      - key: RAILS_MASTER_KEY
        sync: false            # same value as the web service
      - key: DATABASE_URL
        fromDatabase:
          name: bottrunk-db
          property: connectionString
      - key: APP_HOST
        value: bottrunk.com
      - key: SMTP_ADDRESS
        value: smtp.resend.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_DOMAIN
        value: bottrunk.com
      - key: SMTP_USER_NAME
        value: resend
      - key: SMTP_PASSWORD
        sync: false            # same Resend API key
      - key: MAIL_FROM
        value: BotTrunk <no-reply@bottrunk.com>
      - key: MAIL_REPLY_TO
        value: hello@bottrunk.com
      - key: ADMIN_EMAIL
        sync: false

databases:
  - name: bottrunk-db
    plan: basic-256mb
    region: ohio
    databaseName: bottrunk
    user: bottrunk
