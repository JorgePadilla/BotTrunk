# Render Blueprint for BotTrunk. Docs: https://render.com/docs/blueprint-spec
# One web service (the Rails gateway, Docker) + one Postgres. Runbook: docs/deploy.md
services:
  - type: web
    name: bottrunk-gateway
    runtime: docker
    rootDir: gateway
    dockerfilePath: ./Dockerfile
    dockerCommand: ./bin/render-start
    preDeployCommand: ./bin/rails db:prepare
    plan: starter
    region: ohio
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: RAILS_ENV
        value: production
      - key: BINDING
        value: 0.0.0.0
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: RAILS_LOG_LEVEL
        value: info
      - key: RAILS_MASTER_KEY
        sync: false            # paste from gateway/config/master.key in the Render dashboard
      - key: ADMIN_PASSWORD
        sync: false            # HTTP basic auth for /admin/* (user: anything, e.g. admin)
      - key: HNL_RATE_SPREAD
        value: "1.50"          # lempiras per dollar below the reference rate (deposit-bac-*)
      - key: DEPOSIT_FEE_BPS
        value: "500"           # 5 % fee on top of the spread
      - key: MAXMIND_LICENSE_KEY
        sync: false            # free GeoLite2 key: country/city of visitors in /admin/stats
      - key: BCH_API_KEY
        sync: false            # Banco Central de Honduras Web API key (free): hourly reference rate
      # BCH_TCR_INDICATOR_ID (optional, default 97) · HNL_PER_USD (optional): pin the rate by hand
      - key: DATABASE_URL
        fromDatabase:
          name: bottrunk-db
          property: connectionString
      - key: BOTTRUNK_PUBLIC_HOST
        value: https://api.bottrunk.com
      - key: ALGORAND_NETWORK
        value: mainnet         # gateway wallet opted in to USDC 31566704 on Sept 11, 2026
      - key: APP_HOST
        value: bottrunk.com

databases:
  - name: bottrunk-db
    plan: basic-256mb
    region: ohio
    databaseName: bottrunk
    user: bottrunk
