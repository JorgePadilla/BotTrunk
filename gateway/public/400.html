<!doctype html>
<html lang="en">

    <style>
      @font-face { font-family: "Geist"; src: url("/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
      *, *::before, *::after { box-sizing: border-box; margin: 0; }

    <header><div class="wrap"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3 3 20h18L12 3z"/></svg>BotTrunk</div></header>
